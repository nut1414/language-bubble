name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LanguageBubble
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-Ctarget-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LanguageBubble
          save-if: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw 'Could not read the package version from Cargo.toml'
          }
          $expectedTag = "v$($Matches[1])"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag '$env:RELEASE_TAG' must match '$expectedTag'"
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

  build:
    needs: quality
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact: LanguageBubble-win-x64
          - target: aarch64-pc-windows-msvc
            artifact: LanguageBubble-win-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        working-directory: LanguageBubble
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LanguageBubble
          key: ${{ matrix.target }}
          save-if: false

      - name: Build
        working-directory: LanguageBubble
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-Ctarget-feature=+crt-static"
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER: link.exe
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: "-Ctarget-feature=+crt-static"

      - name: Rename artifact
        run: |
          Copy-Item "LanguageBubble/target/${{ matrix.target }}/release/language-bubble.exe" "${{ matrix.artifact }}.exe"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.exe

  # Package the exact executables being released into the Store MSIX bundle.
  package:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: LanguageBubble-win-*
          path: exes
          merge-multiple: true

      - name: Stage executables for packaging
        shell: pwsh
        run: |
          $layout = @{
            "LanguageBubble-win-x64.exe"   = "x86_64-pc-windows-msvc"
            "LanguageBubble-win-arm64.exe" = "aarch64-pc-windows-msvc"
          }
          foreach ($name in $layout.Keys) {
            $dir = "LanguageBubble/target/$($layout[$name])/release"
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            Copy-Item "exes/$name" "$dir/language-bubble.exe"
          }

      - name: Build MSIX packages and bundle
        shell: pwsh
        run: ./scripts/package-msix.ps1 -SkipBuild -OutputDirectory dist

      - uses: actions/upload-artifact@v4
        with:
          name: LanguageBubble-msix
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
