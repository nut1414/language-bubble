name: Nightly

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even if the commit has not changed since the last nightly
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_TAG: nightly

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    # Nightly always tracks main; ignore manual runs started from other refs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      short_sha: ${{ steps.check.outputs.short_sha }}
      date: ${{ steps.check.outputs.date }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare with previous nightly
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          previous=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | sort -k2 | tail -n1 | cut -f1)
          echo "Previous nightly: ${previous:-<none>}"
          echo "Current commit:   $GITHUB_SHA"
          if [ "$FORCE" = "true" ] || [ "$previous" != "$GITHUB_SHA" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No new commits since the last nightly; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

  quality:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LanguageBubble
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-Ctarget-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LanguageBubble
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

  build:
    needs: [check, quality]
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    env:
      ARTIFACT: LanguageBubble-nightly-${{ needs.check.outputs.short_sha }}-win-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        working-directory: LanguageBubble
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: LanguageBubble
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        working-directory: LanguageBubble
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          LANGUAGE_BUBBLE_BUILD_COMMIT: ${{ github.sha }}
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-Ctarget-feature=+crt-static"
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER: link.exe
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: "-Ctarget-feature=+crt-static"

      - name: Rename artifact
        run: |
          Copy-Item "LanguageBubble/target/${{ matrix.target }}/release/language-bubble.exe" "$($env:ARTIFACT).exe"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ env.ARTIFACT }}.exe
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Nightly ${{ needs.check.outputs.date }} (${{ needs.check.outputs.short_sha }})
          NOTES: Automated build of ${{ github.sha }} from `main`. This is not a stable release and may contain bugs.
        run: |
          set -euo pipefail
          api="repos/$GH_REPO"

          # Only a confirmed "not found" may take the create path; other lookup errors abort.
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2> lookup.err); then
            if [ "$state" = "true" ]; then
              # Leftover draft from a failed first publish.
              gh release delete "$RELEASE_TAG" --yes
              state=missing
            fi
          elif grep -q "release not found" lookup.err; then
            state=missing
          else
            cat lookup.err >&2
            exit 1
          fi

          if [ "$state" = "missing" ]; then
            # Drop an orphaned tag, if any, so the release is created at this commit.
            gh api -X DELETE "$api/git/refs/tags/$RELEASE_TAG" > /dev/null 2>&1 || true
            gh release create "$RELEASE_TAG" artifacts/* --prerelease --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
            exit 0
          fi

          # Drop staged leftovers from an earlier failed run so they can't be swapped in.
          gh api "$api/releases/tags/$RELEASE_TAG" --jq '.assets[] | select(.name | endswith(".new")) | .id' |
            while read -r id; do gh api -X DELETE "$api/releases/assets/$id"; done

          # Upload replacements under temporary names so the current assets stay downloadable.
          mkdir staged
          for f in artifacts/*; do cp "$f" "staged/$(basename "$f").new"; done
          gh release upload "$RELEASE_TAG" staged/*

          # Swap: file names carry the commit, so remove every previous asset, then
          # drop the .new suffix from the staged ones.
          assets=$(gh api "$api/releases/tags/$RELEASE_TAG" --jq '.assets[] | "\(.id) \(.name)"')
          while read -r id name; do
            if [[ "$name" != *.new ]]; then
              gh api -X DELETE "$api/releases/assets/$id"
            fi
          done <<< "$assets"
          while read -r id name; do
            if [[ "$name" == *.new ]]; then
              gh api -X PATCH "$api/releases/assets/$id" -f name="${name%.new}" > /dev/null
            fi
          done <<< "$assets"

          gh release edit "$RELEASE_TAG" --prerelease --title "$TITLE" --notes "$NOTES"

          # Move the tag last: the check job treats it as the published commit, so any
          # failure above leaves it unmoved and the next run retries the publish.
          gh api -X PATCH "$api/git/refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
