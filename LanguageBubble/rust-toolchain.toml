# Pinned so a new Rust release (and its new Clippy lints) can't break CI or a
# release on unchanged code. Bump deliberately; rustup installs it automatically.
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
profile = "minimal"
